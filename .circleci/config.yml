version: 2.1

jobs:
  mux9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define routes
          command: |
            printf 'GET /health\nGET /ready\n' > routes.txt
      - run:
          name: Build router
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mux9 -j2
      - run:
          name: Benchmark route match
          command: LIONSS_LP=1 ./build/mux9 --routes routes.txt --conns 256
  unwind-fp:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load frames
          command: |
            printf 'frames 32\n' > unwind.cfg
      - run:
          name: Build unwinder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target unwind-fp -j2
      - run:
          name: Walk frame pointers
          command: LIONSS_LP=1 ./build/unwind-fp --conf unwind.cfg --max 256
  PidAutotune:
